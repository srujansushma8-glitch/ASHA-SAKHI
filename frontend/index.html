<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#087F8C" />
    <meta name="description" content="ASHA Sakhi - Digital Companion for Community Healthcare Workers across India. Offline data capture, voice visit logging, immunization schedules, and supervisor reporting." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ASHA Sakhi" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Premium Fonts: Cormorant Garamond (Serif), Poppins & DM Sans (Body/UI), Playfair Display, Plus Jakarta Sans, Indic Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600;1,700&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    
    <title>ASHA Sakhi | आशा सखी | ಆಶಾ ಸಖಿ - Empowering Community Healthcare at the Last Mile</title>
  </head>
  <body class="bg-[#FAF9F5] text-[#142B45] antialiased selection:bg-[#19B8D5]/20 selection:text-[#142B45] min-h-screen font-sans">
    <div id="root"></div>

    <script>
      window.addEventListener('error', function(e) {
        console.error('[GLOBAL ERROR]', e.message, e.filename, e.lineno, e.error);
        var el = document.getElementById('root');
        if (el) {
          el.innerHTML = '<div style="padding:30px;color:#900;font-family:sans-serif;background:#fff0f0;border:2px solid red;margin:20px;border-radius:12px;"><h2>JavaScript Runtime Error</h2><p><b>' + e.message + '</b></p><pre style="white-space:pre-wrap;background:#fff;padding:15px;border-radius:8px;">' + (e.error ? e.error.stack : '') + '</pre></div>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('[UNHANDLED REJECTION]', e.reason);
        var el = document.getElementById('root');
        if (el) {
          el.innerHTML = '<div style="padding:30px;color:#900;font-family:sans-serif;background:#fff0f0;border:2px solid red;margin:20px;border-radius:12px;"><h2>Unhandled Promise Rejection</h2><pre style="white-space:pre-wrap;background:#fff;padding:15px;border-radius:8px;">' + (e.reason ? (e.reason.stack || e.reason) : e) + '</pre></div>';
        }
      });
    </script>

    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register PWA Service Worker if supported
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => console.log('[PWA] ServiceWorker registered:', reg.scope),
            (err) => console.warn('[PWA] ServiceWorker registration failed:', err)
          );
        });
      }
    </script>
  </body>
</html>

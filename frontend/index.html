    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ASHA Sakhi" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Premium Fonts: Plus Jakarta Sans, Playfair Display (Serif), Noto Sans Devanagari (Hindi), Noto Sans Kannada -->

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,600&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    
    <title>ASHA Sakhi | आशा सखी | ಆಶಾ ಸಖಿ - Empowering Community Healthcare at the Last Mile</title>

  <body class="bg-[#FAF9F5] text-[#142B45] antialiased selection:bg-[#19B8D5]/20 selection:text-[#142B45] min-h-screen font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register PWA Service Worker if supported
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => console.log('[PWA] ServiceWorker registered:', reg.scope),
            (err) => console.warn('[PWA] ServiceWorker registration failed:', err)
          );
        });
      }
    </script>
  </body>

name: Run Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest
        env:
          DATABASE_URL: "sqlite:///./data/test_asha_sakhi.db"
          ASR_MODE: "mock"
          TTS_MODE: "mock"
          EXTRACTION_MODE: "deterministic"
          PYTHONPATH: "backend"
        run: |
          pytest backend/tests/
